name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # `build` runs `tsc -b` (type-check) before `vite build`.
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      # Same Dockerfile Railway uses; catches deploy breakage before Railway does.
      - run: docker build --build-arg VITE_SUPABASE_URL=https://ci-placeholder.supabase.co --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder -t samvad-ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name samvad -e PORT=8080 -p 8080:8080 samvad-ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          # Home page and an SPA deep link both serve the app shell.
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/patients/SMV-1001 | grep -q '<div id="root">'
          # Hashed assets are cached for a year; the service worker is not cached.
          asset=$(curl -fsS http://localhost:8080/ | grep -oE '/assets/[^"]+\.js' | head -1)
          curl -fsSI "http://localhost:8080$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          curl -fsSI http://localhost:8080/sw.js | grep -qi 'cache-control: no-cache'
          # The API answers behind Caddy and refuses calls without a sign-in.
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
          curl -fsS http://localhost:8080/api/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"text":"hi","language":"en"}' http://localhost:8080/api/tts)" = 401
          echo "Container OK"

      - if: failure()
        run: docker logs samvad || true
